odul QR de pe hârtie. Dacă nu funcționează tipărit, mărește-l."]}],"tabele":[{"title":"Tabelul A – Planul meu de difuzare","head":["Unde / cui","Ce trimit sau afișez","Când","Făcut"],"widths":[3000,3600,1600,1400],"rows":[["","","",""],["","","",""],["","","",""],["","","",""],["","","",""]]}],"verifica":["Afișul are un singur mesaj principal","Codul QR are cel puțin 3 cm și funcționează tipărit","Am două postări în formate diferite","Am scris textul de prezentare","Am completat planul de difuzare"],"acasa":"Pregătește prezentarea de 5 minute pentru ora următoare. Exersează cu cronometrul.","scrie":[{"label":"Textul meu de prezentare (5–6 propoziții):","linii":7}],"indicatii":["Afișul are un singur mesaj. Dacă are trei, nu are niciunul.","Codul QR de minimum 3 cm pe latură. Testează-l tipărit, nu doar pe ecran.","Textul de prezentare se scrie o dată și se folosește peste tot: la lansare, pe site, în mesaje.","Formatele: pătrat 1080×1080 pentru postare, vertical 1080×1920 pentru story."],"greseala":"Afiș plin de text. De la 3 metri nu se citește nimic, deci nimeni nu se oprește.","exemple":[]},{"nr":20,"modul":3,"perioada":"15 – 19 februarie 2027","titlu":"Lansarea: prezintă-ți revista și evaluează-ți parcursul","scop":"Astăzi îți prezinți revista publicului și tragi concluziile celor trei module de lucru.","livrabil":"Prezentarea susținută, fișa de autoevaluare completată și planul numărului următor.","necesar":["Site-ul deschis","Afișul","Această fișă"],"pasi":[{"t":"Pregătește-ți prezentarea de 5 minute","d":["Structura: 1) numele revistei și tema, în 30 de secunde · 2) cui i se adresează · 3) de ce ai ales culorile și fontul · 4) articolul de care ești cel mai mândru și de ce · 5) cea mai grea problemă întâmpinată și cum ai rezolvat-o · 6) demonstrație: deschizi site-ul și răsfoiești revista.","Scrie-ți cele șase idei pe fișă. Nu citi de pe foaie: uită-te la public."]},{"t":"Prezintă","d":["Vorbește rar. Arată revista, nu doar vorbi despre ea.","Când răsfoiești pe proiector, oprește-te la două pagini și explică ce ai vrut să obții."]},{"t":"Ascultă și notează feedbackul","d":["Notează în tabelul A ce spun colegii, profesorii și invitații.","Nu te apăra. Doar notează. Vei decide singur, mai târziu, ce ai de făcut cu fiecare observație."]},{"t":"Completează autoevaluarea","d":["Tabelul B. Fii sincer: nota nu depinde de bifele tale, ci de cât de bine te cunoști."]},{"t":"Evaluează munca a doi colegi","d":["Tabelul C. Scrie și o apreciere concretă, nu „a fost frumos”."]},{"t":"Fă planul numărului 2","d":["Ce păstrezi din numărul 1? Ce schimbi? Ce articol ți-a rămas nescris?","Chiar dacă proiectul se încheie aici, revista ta poate continua."]}],"tabele":[{"title":"Tabelul A – Feedbackul primit la lansare","head":["De la cine","Ce a apreciat","Ce a sugerat"],"widths":[2400,3800,3400],"rows":[["","",""],["","",""],["","",""],["","",""]]},{"title":"Tabelul B – Autoevaluare finală (1 = deloc, 5 = în foarte mare măsură)","head":["Afirmația","1","2","3","4","5"],"widths":[5400,850,850,850,850,850],"rows":[["Mi-am respectat termenele","","","","",""],["Am dus la capăt ce am început","","","","",""],["Am cerut ajutor când m-am blocat","","","","",""],["Am folosit feedbackul primit","","","","",""],["Am învățat să folosesc instrumente noi","","","","",""],["Sunt mulțumit(ă) de revista mea","","","","",""]]},{"title":"Tabelul C – Evaluarea colegilor","head":["Numele colegului","Ce mi-a plăcut la revista lui","Notă (1–10)"],"widths":[2600,5600,1400],"rows":[["","",""],["","",""]]}],"verifica":["Mi-am prezentat revista în fața clasei","Am arătat site-ul și am răsfoit revista","Am notat feedbackul primit","Am completat toate cele trei tabele","Am scris planul numărului următor"],"acasa":"—","scrie":[{"label":"Cele șase idei ale prezentării mele:","linii":6},{"label":"Planul numărului 2 – ce păstrez, ce schimb, ce adaug:","linii":5}],"indicatii":["Prezintă 5 minute, cronometrat. Exersează cu voce tare de două ori înainte.","Arată revista, nu vorbi doar despre ea. Deschide site-ul și răsfoiește două pagini.","La feedback: notează, nu te apăra. Decizi tu mai târziu ce faci cu fiecare observație.","Spune și ce nu a mers. O problemă rezolvată e mai interesantă decât o pagină reușită."],"greseala":"Citești de pe foaie, cu spatele la ecran. Prezentarea se pierde, oricât de bună e revista.","exemple":[]}];
const EXEMPLE = {"anatomie":{"titlu":"Anatomia unei coperte","intro":"Cele cinci elemente pe care trebuie să le aibă orice copertă. Nimic în plus.","html":"\n  <div class=\"demo-row\">\n    <div class=\"cover-demo\">\n      <div class=\"cd-img\"><span>imaginea principală<br>ocupă toată pagina</span></div>\n      <div class=\"cd-masthead\">NUMELE REVISTEI</div>\n      <div class=\"cd-sub\">subtitlu scurt</div>\n      <div class=\"cd-acros big\">Titlul articolului principal</div>\n      <div class=\"cd-acros\">Al doilea titlu de acroș</div>\n      <div class=\"cd-acros\">Al treilea titlu</div>\n      <div class=\"cd-meta\">Nr. 1 · februarie 2027 · Nume Prenume, XI A</div>\n    </div>\n    <ol class=\"demo-legend\">\n      <li><b>Capul de revistă</b> — numele, mare, sus. Este logoul revistei tale.</li>\n      <li><b>Imaginea principală</b> — una singură, clară, pe toată pagina.</li>\n      <li><b>Titlurile de acroș</b> — 2–3, dintre care unul clar mai mare: acela e articolul principal.</li>\n      <li><b>Numărul și data</b> — mic, undeva la margine.</li>\n      <li><b>Autorul</b> — numele tău și clasa, discret.</li>\n    </ol>\n  </div>"},"coperta":{"titlu":"Copertă bună / copertă aglomerată","intro":"Aceleași informații, două rezultate. Diferența nu e talentul, ci numărul de elemente.","html":"\n  <div class=\"demo-row\">\n    <div>\n      <div class=\"cover-demo good\">\n        <div class=\"cd-img\"></div>\n        <div class=\"cd-masthead\">ORIZONT</div>\n        <div class=\"cd-acros big\">Trei zile în deltă,<br>fără telefon</div>\n        <div class=\"cd-acros\">Cum arată liceul la 6 dimineața</div>\n        <div class=\"cd-meta\">Nr. 1 · 2027</div>\n      </div>\n      <p class=\"demo-tag ok\">Un mesaj clar, spațiu liber, ierarhie vizibilă</p>\n    </div>\n    <div>\n      <div class=\"cover-demo bad\">\n        <div class=\"cd-img\"></div>\n        <div class=\"cd-chaos\">\n          <span>ORIZONT</span><span>Interviu!</span><span>Recenzii</span>\n          <span>Top 10 filme</span><span>Reportaj</span><span>Poezii</span>\n          <span>Test: ce tip ești?</span><span>Sport</span><span>Rebus</span>\n          <span>Editorial</span><span>Fotografii</span><span>Concurs</span>\n        </div>\n      </div>\n      <p class=\"demo-tag nu\">Douăsprezece mesaje înseamnă zero mesaje</p>\n    </div>\n  </div>"},"palete":{"titlu":"Trei palete care funcționează","intro":"Culoarea principală pentru titluri, cea secundară pentru fundaluri, cea de accent folosită rar.","html":"\n  <div class=\"pal-wrap\">\n    <div class=\"pal\">\n      <div class=\"pal-name\">Sobru — pentru teme culturale</div>\n      <div class=\"sw\" style=\"background:#1F3864\"><span>#1F3864</span></div>\n      <div class=\"sw\" style=\"background:#C9D6E5;color:#1F3864\"><span>#C9D6E5</span></div>\n      <div class=\"sw\" style=\"background:#C0392B\"><span>#C0392B</span></div>\n    </div>\n    <div class=\"pal\">\n      <div class=\"pal-name\">Natural — pentru natură, călătorii</div>\n      <div class=\"sw\" style=\"background:#2D5F3F\"><span>#2D5F3F</span></div>\n      <div class=\"sw\" style=\"background:#E8E2D0;color:#2D5F3F\"><span>#E8E2D0</span></div>\n      <div class=\"sw\" style=\"background:#D98E04\"><span>#D98E04</span></div>\n    </div>\n    <div class=\"pal\">\n      <div class=\"pal-name\">Contrast — pentru sport, muzică</div>\n      <div class=\"sw\" style=\"background:#141414\"><span>#141414</span></div>\n      <div class=\"sw\" style=\"background:#EDEDED;color:#141414\"><span>#EDEDED</span></div>\n      <div class=\"sw\" style=\"background:#E63946\"><span>#E63946</span></div>\n    </div>\n  </div>\n  <p class=\"demo-note\">Regula 60–30–10: 60% culoare deschisă (fundal), 30% culoare principală, 10% accent.</p>"},"fonturi":{"titlu":"Perechi de fonturi care merg împreună","intro":"Un font pentru titluri, unul pentru text. Niciodată mai mult de două.","html":"\n  <div class=\"font-wrap\">\n    <div class=\"font-card\">\n      <div class=\"fc-t\" style=\"font-family:Georgia,serif\">Playfair / Georgia</div>\n      <div class=\"fc-b\" style=\"font-family:'Segoe UI',Arial,sans-serif\">Lora, Source Sans, Arial — text de articol, 10–11 pt, interlinie 1,4. Se citește ușor pe rânduri lungi.</div>\n      <div class=\"fc-l\">Titlu cu serife + text fără serife — elegant, potrivit pentru literatură</div>\n    </div>\n    <div class=\"font-card\">\n      <div class=\"fc-t\" style=\"font-family:'Segoe UI',Arial,sans-serif;font-weight:800;letter-spacing:-.5px\">Montserrat / Segoe</div>\n      <div class=\"fc-b\" style=\"font-family:Georgia,serif\">Merriweather, Georgia — text cu serife, foarte lizibil la corp mic, clasic pentru reviste tipărite.</div>\n      <div class=\"fc-l\">Titlu fără serife + text cu serife — modern, potrivit pentru actualitate</div>\n    </div>\n    <div class=\"font-card\">\n      <div class=\"fc-t\" style=\"font-family:'Segoe UI',Arial,sans-serif;font-weight:300;letter-spacing:3px;text-transform:uppercase\">Raleway light</div>\n      <div class=\"fc-b\" style=\"font-family:'Segoe UI',Arial,sans-serif\">Open Sans, Roboto — neutru, sigur, nu obosește. Alegerea corectă când nu ești sigur.</div>\n      <div class=\"fc-l\">Aceeași familie, greutăți diferite — cea mai sigură variantă</div>\n    </div>\n  </div>\n  <p class=\"demo-note\">Fonturi gratuite: fonts.google.com. Caută perechea și notează numele exact, ca s-o găsești în Canva.</p>"},"sumar":{"titlu":"Model de sumar","intro":"Numărul paginii mare și colorat, titlul, o descriere de maximum 8 cuvinte.","html":"\n  <div class=\"sumar-demo\">\n    <div class=\"sd-title\">SUMAR</div>\n    <div class=\"sd-row\"><span class=\"sd-no\">03</span><div><b>Editorial</b><em>De ce am făcut revista asta</em></div></div>\n    <div class=\"sd-row\"><span class=\"sd-no\">04</span><div><b>Biblioteca rămâne deschisă până la 18</b><em>Ce se schimbă pentru elevi din octombrie</em></div></div>\n    <div class=\"sd-row\"><span class=\"sd-no\">06</span><div><b>„Am învățat să citesc abia la liceu”</b><em>Interviu cu un absolvent</em></div></div>\n    <div class=\"sd-row\"><span class=\"sd-no\">08</span><div><b>Trei zile fără telefon</b><em>Reportaj din tabăra de la Măcin</em></div></div>\n    <div class=\"sd-row\"><span class=\"sd-no\">10</span><div><b>Baltagul, citit la 17 ani</b><em>Recenzie</em></div></div>\n    <div class=\"sd-row\"><span class=\"sd-no\">11</span><div><b>Ce ascultăm în pauze</b><em>Top realizat din 68 de răspunsuri</em></div></div>\n  </div>"},"titluri":{"titlu":"Titluri slabe și titluri bune","intro":"Titlul bun e concret, are verb și nu depășește 8 cuvinte.","html":"\n  <table class=\"cmp\">\n    <tr><th>Slab</th><th>Bun</th><th>De ce</th></tr>\n    <tr><td class=\"nu\">Despre lectură</td><td class=\"ok\">Trei cărți citite într-o singură noapte</td><td>Concret, are cifră, promite o poveste</td></tr>\n    <tr><td class=\"nu\">Activitate la bibliotecă</td><td class=\"ok\">Biblioteca rămâne deschisă până la 18</td><td>Spune ce s-a schimbat, nu ce categorie e</td></tr>\n    <tr><td class=\"nu\">Interviu cu un absolvent</td><td class=\"ok\">„Am învățat să citesc abia la liceu”</td><td>Citatul e mai puternic decât eticheta</td></tr>\n    <tr><td class=\"nu\">ȘOCANT! Ce s-a întâmplat în tabără</td><td class=\"ok\">Trei zile fără telefon, în tabăra de la Măcin</td><td>Nu păcăli cititorul; livrează ce promiți</td></tr>\n    <tr><td class=\"nu\">Gânduri și impresii despre anul școlar care a trecut și despre ce urmează</td><td class=\"ok\">Ce ne-a învățat anul trecut</td><td>Maximum 8 cuvinte</td></tr>\n  </table>"},"stire":{"titlu":"Model de știre","intro":"110 cuvinte, piramidă inversată: esențialul în primul paragraf.","html":"\n  <div class=\"art\">\n    <div class=\"art-label\">TITLU (7 cuvinte)</div>\n    <h4>Biblioteca rămâne deschisă până la ora 18</h4>\n    <div class=\"art-label\">ȘAPOU (29 de cuvinte)</div>\n    <p class=\"art-lead\">Din 1 octombrie, elevii pot împrumuta cărți și după terminarea cursurilor. Decizia a venit după o solicitare semnată de 140 de elevi, depusă în septembrie la secretariat.</p>\n    <div class=\"art-label\">CORPUL ȘTIRII — cine, ce, unde, când în primul paragraf</div>\n    <p>Biblioteca liceului funcționează, de la 1 octombrie, după un program prelungit până la ora 18, de luni până joi. Anterior, programul se încheia la ora 14, când elevii de liceu erau încă la cursuri.</p>\n    <p>În noul interval, sala funcționează și ca spațiu de lectură, cu 24 de locuri. Împrumuturile se fac în aceleași condiții ca până acum, cu termen de 14 zile.</p>\n    <p>Conducerea școlii a anunțat că programul va fi evaluat în ianuarie, în funcție de numărul de împrumuturi înregistrate.</p>\n  </div>\n  <p class=\"demo-note\">Observă: nicio propoziție nu începe cu „În ziua de azi”. Știrea intră direct în subiect.</p>"},"interviu":{"titlu":"Model de interviu (fragment)","intro":"Introducere scurtă, apoi întrebări în bold și răspunsuri normale.","html":"\n  <div class=\"art\">\n    <h4>„Am învățat să citesc abia la liceu”</h4>\n    <p class=\"art-lead\">A terminat liceul acum patru ani și acum studiază litere. Spune că în gimnaziu nu citea nimic din ce i se dădea. L-am întrebat ce s-a schimbat.</p>\n    <p><b>Ce înseamnă că ai învățat să citești abia la liceu?</b></p>\n    <p>Că până atunci parcurgeam textul cu ochii și îmi notam ce spunea profesorul. Nu înțelegeam de ce cineva ar face asta de plăcere. Prima carte pe care am citit-o singur, până la capăt, într-o noapte, a fost în clasa a X-a.</p>\n    <p><b>Ce a declanșat schimbarea?</b></p>\n    <p>Un profesor care ne-a spus să alegem noi ce citim. Prima dată când am ales singur, am ales prost. A doua oară, mai bine.</p>\n    <p><b>Ce le-ai spune elevilor care sunt acum unde erai tu?</b></p>\n    <p>Că nu e vina lor și nici a cărților. Doar că nu s-au întâlnit încă.</p>\n  </div>\n  <p class=\"demo-note\">Întrebările sunt deschise, scurte și decurg din răspunsul anterior. Reporterul nu vorbește mai mult decât intervievatul.</p>"},"reportaj":{"titlu":"Model de reportaj (început)","intro":"Reportajul începe cu o scenă, nu cu o explicație. Cititorul trebuie să vadă.","html":"\n  <div class=\"art\">\n    <h4>Trei zile fără telefon</h4>\n    <p class=\"art-lead\">Douăzeci și doi de elevi au predat telefoanele vineri dimineața, într-o cutie de carton. Le-au primit înapoi duminică la prânz. În trei zile s-a schimbat mai mult decât se aștepta oricine.</p>\n    <p class=\"art-label\">INTERTITLU</p>\n    <p><b>Primele două ore</b></p>\n    <p>La ora nouă, cutia era plină și nimeni nu mai avea ce face cu mâinile. Cineva a scos un pachet de cărți de joc din rucsac. Până la prânz, în autocar se juca la patru rânduri de scaune deodată.</p>\n    <p><b>Seara, la foc</b></p>\n    <p>Vineri seara nu a mai verificat nimeni cât e ceasul. Discuția a durat până la unu noaptea și nu a fost despre nimic anume — exact asta a fost observația pe care au repetat-o toți a doua zi.</p>\n  </div>\n  <p class=\"demo-note\">Detaliile concrete (cutia de carton, cărțile de joc, ora unu noaptea) fac reportajul. Adjectivele nu.</p>"},"recenzie":{"titlu":"Model de recenzie","intro":"Ce e cartea, ce ai simțit, cui i-o recomanzi. Fără rezumatul întregii acțiuni.","html":"\n  <div class=\"art\">\n    <h4>Baltagul, citit la 17 ani</h4>\n    <p class=\"art-lead\">L-am citit prima dată în clasa a opta, pentru teză, și nu am înțeles nimic. L-am recitit anul acesta, din proprie inițiativă, și mi-a luat două zile.</p>\n    <p>Ce mi se păruse atunci o poveste lentă despre un drum s-a dovedit a fi o carte despre răbdare. Vitoria Lipan nu caută un vinovat, îl așteaptă: merge din sat în sat, pune întrebări care par banale și își notează în minte răspunsurile. Nu are grabă și nu are îndoială.</p>\n    <p>Partea care m-a ținut treaz nu a fost finalul, pe care oricum îl știam, ci felul în care fiecare om întâlnit pe drum spune ceva fără să vrea. Cartea te învață să asculți ce se spune pe lângă subiect.</p>\n    <p>O recomand celor care au citit-o la 14 ani și au rămas cu impresia că e plictisitoare. Nu cartea era problema.</p>\n  </div>"},"editorial":{"titlu":"Model de editorial","intro":"150 de cuvinte, la persoana I. Spui de ce ai făcut revista și ce va găsi cititorul.","html":"\n  <div class=\"art\">\n    <h4>De ce am făcut revista asta</h4>\n    <p>Am început pentru că mi s-a cerut la ora de TIC și am continuat pentru că, pe la a treia pagină, mi-am dat seama că nimeni din liceu nu scrisese până atunci despre ce se întâmplă în bibliotecă după ora două.</p>\n    <p>Revista aceasta are douăsprezece pagini și un singur subiect: cititul, așa cum arată el la noi, nu cum arată în programă. Veți găsi o știre despre programul prelungit al bibliotecii, un interviu cu un absolvent care a început să citească târziu, un reportaj din tabăra în care nu am avut telefoane trei zile și o recenzie la o carte pe care toți credem că o știm.</p>\n    <p>Am scris, fotografiat și machetat singur totul. Greșelile rămase sunt ale mele. Dacă o pagină vă face să deschideți o carte, a meritat.</p>\n  </div>"},"macheta":{"titlu":"Pagină machetată bine / prost","intro":"Aceleași elemente, aceeași cantitate de text. Diferă doar alinierea și spațiul.","html":"\n  <div class=\"demo-row\">\n    <div>\n      <div class=\"page-demo good\">\n        <div class=\"pd-title\"></div><div class=\"pd-lead\"></div>\n        <div class=\"pd-cols\"><div class=\"pd-col\"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class=\"pd-col\"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>\n        <div class=\"pd-img\"></div><div class=\"pd-cap\"></div>\n        <div class=\"pd-no\">7</div>\n      </div>\n      <p class=\"demo-tag ok\">Grilă respectată, margini egale, spațiu de respiro</p>\n    </div>\n    <div>\n      <div class=\"page-demo bad\">\n        <div class=\"pd-title\" style=\"width:92%;margin-left:0\"></div>\n        <div class=\"pd-cols\" style=\"gap:2px\"><div class=\"pd-col\"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class=\"pd-col\" style=\"margin-top:9px\"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>\n        <div class=\"pd-img\" style=\"width:40%;transform:rotate(-2deg);margin:4px 0 0 6px\"></div>\n        <div class=\"pd-img\" style=\"width:34%;margin:-28px 0 0 58%\"></div>\n      </div>\n      <p class=\"demo-tag nu\">Coloane dezaliniate, imagini întâmplătoare, fără margini</p>\n    </div>\n  </div>"},"foto":{"titlu":"Regula treimilor și greșelile de fotografie","intro":"Elementul important nu se pune în mijloc, ci pe una dintre liniile de împărțire.","html":"\n  <div class=\"demo-row\">\n    <div>\n      <div class=\"photo-demo\">\n        <div class=\"thirds\"></div>\n        <div class=\"subject\" style=\"left:66%;top:33%\"></div>\n        <div class=\"horizon\" style=\"top:66%\"></div>\n      </div>\n      <p class=\"demo-tag ok\">Subiectul la intersecția liniilor, orizontul pe treimea de jos</p>\n    </div>\n    <div>\n      <div class=\"photo-demo\">\n        <div class=\"thirds\"></div>\n        <div class=\"subject\" style=\"left:50%;top:50%\"></div>\n        <div class=\"horizon\" style=\"top:50%;transform:rotate(-4deg)\"></div>\n      </div>\n      <p class=\"demo-tag nu\">Subiect fix în mijloc, orizont strâmb, tăiat în două</p>\n    </div>\n  </div>\n  <ul class=\"tick\">\n    <li>Lumina vine din spatele tău, nu din spatele subiectului</li>\n    <li>Fundal curat: mută-te doi pași, nu lăsa coșul de gunoi în cadru</li>\n    <li>Fotografiază și pe verticală — paginile de revistă sunt verticale</li>\n    <li>Minimum 1500 px pe latura mare, altfel iese pixelat la tipar</li>\n  </ul>"},"corectura":{"titlu":"Greșeli pe care corectorul automat nu le vede","intro":"Toate formele din stânga sunt cuvinte corecte în română — doar că nu în contextul acela.","html":"\n  <table class=\"cmp\">\n    <tr><th>Greșit</th><th>Corect</th><th>Regula</th></tr>\n    <tr><td class=\"nu\">Vreau sa scriu</td><td class=\"ok\">Vreau să scriu</td><td>„sa” există (a sa), dar conjunctivul cere „să”</td></tr>\n    <tr><td class=\"nu\">I-a spus ca ia cartea</td><td class=\"ok\">I-a spus că ia cartea</td><td>„ca” = comparativ; „că” = conjuncție</td></tr>\n    <tr><td class=\"nu\">Elevii care i-am întâlnit</td><td class=\"ok\">Elevii pe care i-am întâlnit</td><td>Complement direct: „pe care”</td></tr>\n    <tr><td class=\"nu\">Ne-am întâlnit cu-al doilea grup</td><td class=\"ok\">Ne-am întâlnit cu al doilea grup</td><td>Cratimă doar când se pierde o silabă</td></tr>\n    <tr><td class=\"nu\">\"Citate cu ghilimele drepte\"</td><td class=\"ok\">„Citate cu ghilimele românești”</td><td>Deschidere jos, închidere sus</td></tr>\n    <tr><td class=\"nu\">Data de 15.09.2026 si ora 14:00</td><td class=\"ok\">15 septembrie 2026, ora 14.00</td><td>Alege un format și păstrează-l în toată revista</td></tr>\n  </table>"},"checklist":{"titlu":"Lista de control înainte de publicare","intro":"Se parcurge pagină cu pagină, nu din memorie. Bifele se salvează în browserul tău.","html":"CHECKLIST_PLACEHOLDER"},"platforme":{"titlu":"Unde publici revista — comparație","intro":"Toate au variantă gratuită. Verifică în ziua lecției: condițiile se schimbă.","html":"\n  <table class=\"cmp wide\">\n    <tr><th>Platformă</th><th>Plan gratuit</th><th>Reclame / siglă</th><th>Încorporare în site</th><th>Bun pentru</th></tr>\n    <tr><td><b>Heyzine</b></td><td>câteva publicații</td><td class=\"ok\">fără reclame</td><td class=\"ok\">da</td><td>Alegerea implicită pentru școală</td></tr>\n    <tr><td><b>FlipHTML5</b></td><td>publicații limitate</td><td>siglă discretă</td><td class=\"ok\">da</td><td>Alternativă solidă</td></tr>\n    <tr><td><b>Issuu</b></td><td>1 publicație activă</td><td class=\"nu\">marcaj vizibil</td><td>parțial</td><td>Vizibilitate publică mare</td></tr>\n    <tr><td><b>Flipsnack</b></td><td>1 publicație</td><td>siglă</td><td class=\"ok\">da</td><td>Interfață simplă</td></tr>\n    <tr><td><b>Publuu</b>< function doneChecks(){
  let n=0;
  FISE.forEach(f=>{ const v=S.get('chk:'+f.nr,[]); n += v.filter(Boolean).length; });
  return n;
}
function fisaDone(nr){
  const f = FISE.find(x=>x.nr===nr); const v = S.get('chk:'+nr,[]);
  return f && v.filter(Boolean).length === f.verifica.length;
}
function refreshProgress(){
  const p = Math.round(doneChecks()/totalChecks()*100);
  document.getElementById('progBar').style.width = p+'%';
  document.getElementById('progTxt').textContent = p+'%';
  document.querySelectorAll('[data-navfisa]').forEach(b=>{
    const nr = +b.dataset.navfisa;
    let t = b.querySelector('.tick');
    if(fisaDone(nr)){ if(!t){ t=document.createElement('span'); t.className='tick'; t.textContent='✓'; b.appendChild(t);} }
    else if(t){ t.remove(); }
  });
}

function slug(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,''); }
function fisaFileName(nr, ext){
  const m = me();

let DOCX_LOADING = null;
function loadDocx(){
  if(window.docx) return Promise.resolve(window.docx);
  if(!DOCX_LOADING) DOCX_LOADING = new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/docx@9.7.2/dist/index.iife.js';
    s.onload=()=> window.docx ? res(window.docx) : rej(new Error('docx'));
    s.onerror=()=>{ DOCX_LOADING=null; rej(new Error('docx')); };
    document.head.appendChild(s);
  });
  return DOCX_LOADING;
}
function saveBlob(blob, name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function buildDocx(nr){
  const d = await loadDocx();
  const f = FISE.find(x=>x.nr===nr), m = me();
  const NAVY='1F3864', W=9638;
  const P=(text,o={})=>new d.Paragraph({spacing:{after:o.after??120, before:o.before??0}, children:[new d.TextRun(Object.assign({text:String(text)}, o.run||{}))]});
  const H=(text,lvl)=>new d.Paragraph({spacing:{before:lvl===1?0:240, after:120}, children:[new d.TextRun({text, bold:true, color:NAVY, size:lvl===1?32:24})]});
  const lines=(n)=>Array.from({length:n},()=>P('.'.repeat(110),{after:60, run:{color:'999999'}}));
  const kids=[];
  kids.push(new d.Paragraph({spacing:{after:60}, children:[new d.TextRun({text:'Liceul Teoretic „Panait Cerna” Brăila · TIC · Revista mea', size:18, color:'666666'})]}));
  kids.push(H('Fișa '+f.nr+' – '+f.titlu,1));
  kids.push(P(f.perioada.replace(/\s{2,}/g,' ')+' · '+MODT[f.modul], {run:{size:18,color:'666666'}}));
  kids.push(new d.Paragraph({spacing:{before:120, after:200}, children:[
    new d.TextRun({text:'Nume și prenume: ', bold:true}), new d.TextRun({text: m.nume.trim() || '................................................'}),
    new d.TextRun({text:'     Clasa: ', bold:true}), new d.TextRun({text: m.clasa.trim() || '..................'}),
    new d.TextRun({text:'     Data: ', bold:true}), new d.TextRun({text: new Date().toLocaleDateString('ro-RO')})]}));
  kids.push(new d.Paragraph({spacing:{after:80}, children:[new d.TextRun({text:'Ce faci astăzi: ', bold:true}), new d.TextRun(f.scop)]}));
  kids.push(new d.Paragraph({spacing:{after:80}, children:[new d.TextRun({text:'La final vei avea: ', bold:true}), new d.TextRun(f.livrabil)]}));
  fisaAnswers(nr).forEach(s=>{
    if(s.type==='table'){
      kids.push(H(s.title,2));
      const tot = s.widths.reduce((a,b)=>a+b,0), w = s.widths.map(x=>Math.round(x*W/tot));
      const cell=(txt,i,head)=>new d.TableCell({width:{size:w[i],type:d.WidthType.DXA},
        shading: head ? {fill:NAVY, type:d.ShadingType.CLEAR, color:'auto'} : undefined,
        margins:{top:60,bottom:60,left:100,right:100},
        children:[new d.Paragraph({children:[new d.TextRun({text:String(txt||''), bold:!!head, color: head?'FFFFFF':undefined, size:20})]})]});
      const rows=[new d.TableRow({tableHeader:true, children:s.head.map((c,i)=>cell(c,i,true))})]
        .concat(s.rows.map(r=>new d.TableRow({height:{value:420, rule:d.HeightRule.ATLEAST}, children:r.map((c,i)=>cell(c,i,false))})));
      kids.push(new d.Table({width:{size:W,type:d.WidthType.DXA}, columnWidths:w, rows}));
    } else if(s.type==='text'){
      kids.push(H(s.label,2));
      const v=String(s.value||'').trim();
      if(v) v.split(/\n+/).forEach(par=>kids.push(P(par)));
      else kids.push(...lines(s.linii||3));
    } else if(s.type==='checks'){
      kids.push(H('Verifică înainte să pleci',2));
      s.items.forEach(it=>kids.push(P((it[1]?'☑  ':'☐  ')+it[0],{after:60})));
    }
  });
  if(f.acasa && f.acasa!=='—'){ kids.push(H('De făcut acasă',2)); kids.push(P(f.acasa)); }
  const doc = new d.Document({
    creator: m.nume || 'Elev', title: 'Fișa '+f.nr+' – '+f.titlu,
    styles:{default:{document:{run:{font:'Calibri', size:22}}}},
    sections:[{properties:{page:{size:{width:11906,height:16838}, margin:{top:1134,bottom:1134,left:1134,right:1134}}}, children:kids}]
  });
  return d.Packer.toBlob(doc);
}
function buildDocHtml(nr){   // rezervă, dacă biblioteca Word nu se poate încărca

  let b='<h1>Fișa '+f.nr+' – '+esc(f.titlu)+'</h1><p><b>Nume și prenume:</b> '+esc(m.nume||'..............................')+' &nbsp; <b>Clasa:</b> '+esc(m.clasa||'..........')+' &nbsp; <b>Data:</b> '+new Date().toLocaleDateString('ro-RO')+'</p>';

}

function wireFeedback(){
  const upd=()=>{ const t=document.getElementById('fbprompt'); if(t) t.value=manualPrompt(fbChoices()); };
  document.querySelectorAll('input[name=focus]').forEach(r=>r.addEventListener('change',()=>{ S.set('fbfocus',r.value); upd(); }));
  document.querySelectorAll('input[name=stadiu]').forEach(r=>r.addEventListener('change',()=>{ S.set('fbstadiu',r.value); upd(); }));
  ['fbpag','fbq'].forEach(id=>{ const e=document.getElementById(id); if(e) e.addEventListener('input',upd); });
  upd();
}
function fbChoices(){
  return {
    focus:(document.querySelector('input[name=focus]:checked')||{}).value||'complet',
    stadiu:(document.querySelector('input[name=stadiu]:checked')||{}).value||'lucru',
    pagini:((document.getElementById('fbpag')||{}).value||'').trim(),
    intrebare:((document.getElementById('fbq')||{}).value||'').trim()
  };
}
function manualPrompt(c){
  let p = SYS_MANUAL + '\n\n' + FOCUS[c.focus].instr + '\n\n' + STADIU[c.stadiu] + '\n\n';
  if(c.pagini) p += 'Uită-te mai ales la paginile: ' + c.pagini + '.\n\n';
  if(c.intrebare) p += 'Întrebarea mea (răspunde-mi la final, într-o secțiune „## Răspuns la întrebarea ta”): «' + c.intrebare + '»\n\n';
  return p + FORMAT_MANUAL.replace('{EXTRA}', FOCUS[c.focus].extra) + '\n\nRevista mea este în fișierul PDF atașat.';
}
async function manualGemini(btn){
  const st = document.getElementById('fbst');
  const p = manualPrompt(fbChoices());
  let copied = false;
  try{ await navigator.clipboard.writeText(p); copied = true; }catch(e){}
  window.open('https://gemini.google.com/app','_blank','noopener');
  if(copied) setSt(st,'ok','Cererea e copiată. În fila Gemini: atașează PDF-ul cu <b>+</b>, lipește cu <b>Ctrl+V</b> și trimite.');
  else { setSt(st,'wait','Browserul nu m-a lăsat să copiez automat. Deschide „Vezi cererea”, selectează tot textul (Ctrl+A) și copiază-l (Ctrl+C).'); const d=document.querySelector('details.hist'); if(d) d.open=true; }
}
function saveFeedback(){
  const ta=document.getElementById('fbpaste'), st=document.getElementById('fbsave');
  const t=(ta.value||'').trim();
  if(t.length<40){ setSt(st,'err','Lipește întâi răspunsul primit de la Gemini.'); return; }
  const h=S.get('fbhist',[]); h.push({d:Date.now(), f:fbChoices().focus, t}); S.set('fbhist', h.slice(-15));
  render(); setTimeout(()=>{ const s=document.getElementById('fbsave'); setSt(s,'ok','Salvat. Îl găsești mai jos, la „Feedbackurile mele”.'); },0);
}
function delFeedback(d){
  if(!confirm('Ștergi acest feedback?')) return;
  S.set('fbhist', S.get('fbhist',[]).filter(h=>h.d!==d)); render();
}

/* ---------- Markdown simplu → HTML (pentru răspunsul Gemini) ---------- */
function mdInline(s){
  return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,'$1<em>$2</em>').replace(/`([^`]+)`/g,'<code>$1</code>');
}
function md(src){
  const L = esc(String(src||'')).replace(/\r/g,'').split('\n');
  let h='', list=null, para=[];
  const flushP=()=>{ if(para.length){ h+='<p>'+mdInline(para.join(' '))+'</p>'; para=[]; } };
  const flushL=()=>{ if(list){ h+='</'+list+'>'; list=null; } };
  for(let i=0;i<L.length;i++){
    const ln=L[i], t=ln.trim();
    if(!t){ flushP(); flushL(); continue; }
    if(t.startsWith('|') && i+1<L.length && /^\s*\|?\s*:?-{2,}/.test(L[i+1])){
      flushP(); flushL();
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>mdInline(c.trim()));
      let tb='<div class="tblwrap"><table><tr>'+cells(t).map(c=>'<th>'+c+'</th>').join('')+'</tr>'; i++;
      while(i+1<L.length && L[i+1].trim().startsWith('|')){ i++; tb+='<tr>'+cells(L[i]).map(c=>'<td>'+c+'</td>').join('')+'</tr>'; }
      h+=tb+'</table></div>'; continue;
    }
    let m;
    if((m=t.match(/^(#{1,6})\s+(.*)$/))){ flushP(); flushL(); h+=(m[1].length<=2?'<h3>':'<h4>')+mdInline(m[2])+(m[1].length<=2?'</h3>':'</h4>'); continue; }
    if((m=t.match(/^[-*•]\s+(.*)$/))){ flushP(); if(list!=='ul'){ flushL(); h+='<ul>'; list='ul'; } h+='<li>'+mdInline(m[1])+'</li>'; continue; }
    if((m=t.match(/^\d+[.)]\s+(.*)$/))){ flushP(); if(list!=='ol'){ flushL(); h+='<ol>'; list='ol'; } h+='<li>'+mdInline(m[1])+'</li>'; continue; }
    if(list && /^\s{2,}/.test(ln)){ h=h.replace(/<\/li>$/,' '+mdInline(t)+'</li>'); continue; }
    flushL(); para.push(t);
  }
  flushP(); flushL();
  return h;
}

    rows += '<tr><td style="text-align:center;font-weight:600">'+i+'</td>'+
      (fix[i] ? '<td>'+fix[i]+'</td><td>—</td>' :
        '<td><input type="text" data-sv="pl_'+i+'_c" placeholder="ce articol pun aici"></td><td><input type="text" data-sv="pl_'+i+'_r" placeholder="rubrica"></td>')+
      '<td><input type="text" data-sv="pl_'+i+'_w" placeholder="cuvinte"></td></tr>';
  }
  return `<div class="kicker">Instrumentul tău de lucru</div><h1 class="page">Revista mea — planificator</h1>
  <p class="meta">Completează o dată și revino aici de fiecare dată când machetezi. Totul se salvează în acest browser.</p>
  <h2 class="sec">Identitatea revistei</h2>
  <div class="card"><div class="two">
    <div>${F('nume','Numele revistei','')}${F('sub','Subtitlul (max. 6 cuvinte)','')}${F('tema','Tema','despre ce este revista')}</div>
    <div>${F('cititor','Cititorul meu','vârstă, ce îl interesează')}${F('ton','Tonul','sobru / prietenos / ironic')}${F('rubrici','Rubricile','separate prin virgulă')}</div>
  </div>
  <label class="fld"><span>Misiunea (maximum 40 de cuvinte)</span><textarea data-sv="p_misiune" placeholder="<Numele> este o revistă pentru... care... despre... pentru ca cititorii să..."></textarea></label>
  </div>
  <h2 class="sec">Identitatea vizuală</h2>
  <div class="card">
    <div class="two">
      <div>${F('c1','Culoarea principală (cod hex)','#1F3864')}${F('c2','Culoarea secundară (cod hex)','#C9D6E5')}${F('c3','Culoarea de accent (cod hex)','#C0392B')}</div>
      <div>${F('f1','Fontul de titlu','')}${F('f2','Fontul de text','')}${F('f3','Corp de literă / interlinie','11 pt / 1,4')}</div>
    </div>
    <div id="swatch" style="display:flex;gap:10px;margin-top:6px"></div>
  </div>
  <h2 class="sec">Planul celor 12 pagini</h2>
  <div class="tblwrap"><table><tr><th style="width:52px">Pag.</th><th>Ce pun pe pagină</th><th style="width:150px">Rubrica</th><th style="width:100px">Cuvinte</th></tr>${rows}</table></div>
  <p class="demo-note">Total recomandat: 2000–3000 de cuvinte. O pagină A4 cu o imagine medie încape cam 300–350 de cuvinte.</p>
  <h2 class="sec">Publicarea</h2>
  <div class="card"><div class="two">
    <div>${F('plat','Platforma de flipbook aleasă','')}${F('mail','Adresa de e-mail folosită','')}</div>
    <div>${F('link','Linkul flipbook-ului','')}${F('site','Adresa site-ului meu','')}</div>
  </div>
  <label class="fld"><span>Codul de încorporare (embed)</span><textarea data-sv="p_embed" placeholder="se lipește aici la Fișa 17"></textarea></label>
  </div>
  <div class="btnrow"><button class="btn ghost" onclick="window.print()">Printează planificatorul</button></div>`;
}

/* ---------- salvare câmpuri ---------- */
function wire(){
  document.querySelectorAll('[data-sv]').forEach(el=>{
    const k = el.dataset.sv;
    const v = S.get('f:'+k, '');
    if(v) el.value = v;
    el.addEventListener('input', ()=>{ S.set('f:'+k, el.value); if(k.startsWith('p_c')) paintSwatch(); });
  });
  document.querySelectorAll('[data-chk]').forEach(lb=>{
    const nr=+lb.dataset.chk, i=+lb.dataset.i;
    const arr = S.get('chk:'+nr, []);
    const cb = lb.querySelector('input');
    cb.checked = !!arr[i];
    lb.classList.toggle('done', cb.checked);
    cb.addEventListener('change', ()=>{
      const a = S.get('chk:'+nr, []); a[i]=cb.checked; S.set('chk:'+nr, a);
      lb.classList.toggle('done', cb.checked);
      refreshProgress();
    });
  });
  paintSwatch();
}
function paintSwatch(){
  const box = document.getElementById('swatch'); if(!box) return;
  box.innerHTML = ['p_c1','p_c2','p_c3'].map(k=>{
    const v = (S.get('f:'+k,'')||'').trim();
    const ok = /^#?[0-9a-fA-F]{6}$/.test(v);
    const col = ok ? (v[0]==='#'?v:'#'+v) : 'transparent';
    return '<div style="flex:1;height:44px;border-radius:8px;border:1px dashed var(--line);background:'+col+'"></div>';
  }).join('');
}
function injectChecklist(){
  document.querySelectorAll('.ex').forEach(ex=>{
    if(ex.innerHTML.indexOf('CHECKLIST_PLACEHOLDER')===-1) return;
    const arr = S.get('chk:pub', []);
    ex.innerHTML = ex.innerHTML.replace('CHECKLIST_PLACEHOLDER',
      CHECKLIST.map((c,i)=>'<label class="chk" data-pub="'+i+'"><input type="checkbox"'+(arr[i]?' checked':'')+'><span>'+esc(c)+'</span></label>').join(''));
    ex.querySelectorAll('[data-pub]').forEach(lb=>{
      const i=+lb.dataset.pub, cb=lb.querySelector('input');
      lb.classList.toggle('done', cb.checked);
      cb.addEventListener('change',()=>{ const a=S.get('chk:pub',[]); a[i]=cb.checked; S.set('chk:pub',a); lb.classList.toggle('done',cb.checked); });
    });
  });
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const nx = cur==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nx);
  S.set('theme', nx);
}
(function init(){
  const t = S.get('theme', null);
  if(t) document.documentElement.setAttribute('data-theme', t);
  buildNav();
  render();
})();
</script>
